services:
  - type: web
    name: assignments-chatbot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: AZURE_FOUNDRY_API_KEY
        sync: false # set in the Render dashboard
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://assignments-chatbot-ui.onrender.com

  - type: web
    name: assignments-chatbot-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://assignments-chatbot-api.onrender.com
