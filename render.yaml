services:
  # API: a GraalVM native image built by GitHub Actions (.github/workflows/native-image.yml)
  # and published to GHCR. Render runs the finished image; it does not build anything.
  # The GHCR package must be public (or add a registry credential in the Render dashboard).
  - type: web
    name: assignments-chatbot-api-native
    runtime: image
    image:
      url: ghcr.io/dhawanrachakonda/assignments-chatbot-api:latest
    region: singapore # closest to Hyderabad and Azure South India
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: AZURE_FOUNDRY_API_KEY
        sync: false # set in the Render dashboard
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://assignments-chatbot-ui.onrender.com
      - key: APP_ACCESS_CODE
        sync: false # passphrase users type on the sign-in screen; if empty, nobody can sign in

  - type: web
    name: assignments-chatbot-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # URL of assignments-chatbot-api-native, e.g. https://assignments-chatbot-api-native.onrender.com
