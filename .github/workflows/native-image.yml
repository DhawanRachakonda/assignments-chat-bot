name: Build native image

# Compiles the Spring Boot GraalVM native image on a GitHub runner (the compile needs several GB of RAM,
# more than Render's build environment gives us) and publishes it to GitHub Container Registry.
# Render then runs the finished image instead of building it.

# Manual only: the compile needs a 16 GB runner, which GitHub provides only for PUBLIC repos.
# To build: make the repo public, Actions -> Build native image -> Run workflow, then make it private again.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Docker image names must be lowercase.
  IMAGE: ghcr.io/dhawanrachakonda/assignments-chatbot-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Private repos get ~7 GB RAM runners; swap keeps the native-image compile from being OOM-killed.
      - name: Add swap
        run: |
          # The runner already uses /swapfile, so add a second swap file on the big /mnt disk.
          df -h /mnt
          sudo fallocate -l 12G /mnt/extra.swap
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
          free -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render does not re-pull ":latest" by itself. If you add a RENDER_DEPLOY_HOOK secret
      # (Render service -> Settings -> Deploy Hook), every successful build redeploys the service.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "RENDER_DEPLOY_HOOK not set; skipping"; fi
